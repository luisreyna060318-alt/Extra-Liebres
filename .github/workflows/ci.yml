name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: extraliebres
          POSTGRES_PASSWORD: extraliebres
          POSTGRES_DB: extraliebresdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extraliebres -d extraliebresdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base desechable del servicio de arriba (su nombre termina en _test,
      # requisito de vitest.setup.ts).
      DATABASE_URL: postgresql://extraliebres:extraliebres@localhost:5432/extraliebresdb_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: El esquema de Prisma coincide con las migraciones
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Vulnerabilidades en dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Vulnerabilidades en dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
