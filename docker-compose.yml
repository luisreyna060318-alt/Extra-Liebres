services:
  db:
    image: postgres:16-alpine
    container_name: extraliebres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: extraliebres
      POSTGRES_PASSWORD: extraliebres
      POSTGRES_DB: extraliebresdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extraliebres -d extraliebresdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: extraliebres-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    container_name: extraliebres-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://extraliebres:extraliebres@db:5432/extraliebresdb?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: extraliebres-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
