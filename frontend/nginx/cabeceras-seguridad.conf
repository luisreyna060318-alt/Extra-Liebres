# Cabeceras de seguridad para la SPA. Se incluyen en cada "location" porque un
# add_header dentro de un location anula los heredados del bloque server.
# (Las respuestas de /api/ ya traen las suyas desde Helmet.)
# Strict-Transport-Security debe agregarse solo cuando el sitio se sirva por HTTPS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
