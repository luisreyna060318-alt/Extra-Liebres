# SPA + proxy inverso hacia la API. El navegador habla solo con este servidor
# (mismo origen), asi que no hace falta CORS ni publicar la API a la red.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    # DNS interno de Docker: resolver "backend" en cada peticion (con una
    # variable) evita que nginx falle al arrancar si la API aun no existe y
    # que se quede con una IP vieja si el contenedor de la API se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:4000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: se pueden guardar en cache para siempre.
    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html siempre se revalida para tomar la version nueva tras un despliegue.
    location = /index.html {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        try_files $uri $uri/ /index.html;
    }
}
